<html lang="en">
  <head>
    <meta charset="UTF-g" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LPG Leakage Mapping System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9; /* slate-100 */
      }
      .leaflet-container {
        height: 100%;
        width: 100%;
      }
      /* Hide the turn-by-turn instruction panel from leaflet-routing-machine */
      .leaflet-routing-container {
        display: none;
      }
      
      .gradient-bg {
          background-color: #020617;
          background-image: radial-gradient(at 27% 37%, hsla(215, 98%, 61%, 0.4) 0px, transparent 50%), 
                            radial-gradient(at 97% 21%, hsla(125, 98%, 72%, 0.4) 0px, transparent 50%),
                            radial-gradient(at 52% 99%, hsla(355, 98%, 76%, 0.4) 0px, transparent 50%),
                            radial-gradient(at 10% 29%, hsla(256, 96%, 68%, 0.4) 0px, transparent 50%),
                            radial-gradient(at 97% 96%, hsla(38, 60%, 74%, 0.4) 0px, transparent 50%),
                            radial-gradient(at 33% 50%, hsla(222, 67%, 73%, 0.4) 0px, transparent 50%),
                            radial-gradient(at 79% 53%, hsla(343, 68%, 79%, 0.4) 0px, transparent 50%);
      }

      /* Keyframes for animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-in-out forwards;
      }
      .animate-fadeInUp {
        animation: fadeInUp 0.5s ease-in-out forwards;
      }
    </style>

  }
}
</script>
